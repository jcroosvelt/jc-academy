<style>
:root{
  --navy:#0C2C74;
  --navy-dark:#071D52;
  --navy-soft:#E7ECF7;
  --gold:#F5A800;
  --gold-light:#FFD166;
  --bg:#FFFFFF;
  --surface:#F7F9FC;
  --text:#14213D;
  --text-muted:#5B6B85;
  --border:#E4E9F2;
  --success:#1D9A6C;
  --radius:14px;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  color:var(--text);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.display{
  font-family:'Sora',sans-serif;
  font-weight:700;
  letter-spacing:-0.01em;
  color:var(--navy-dark);
}
a{text-decoration:none;color:inherit;}
button{font-family:inherit;cursor:pointer;}
img{max-width:100%;display:block;}
.container{max-width:1180px;margin:0 auto;padding:0 24px;}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 24px;border-radius:10px;border:none;font-weight:600;font-size:15px;
  transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-primary:hover{background:var(--navy-dark);box-shadow:0 8px 20px rgba(12,44,116,.25);}
.btn-gold{background:var(--gold);color:var(--navy-dark);}
.btn-gold:hover{background:var(--gold-light);box-shadow:0 8px 20px rgba(245,168,0,.3);}
.btn-outline{background:transparent;border:1.5px solid var(--navy);color:var(--navy);}
.btn-outline:hover{background:var(--navy-soft);}
.btn-outline-white{background:transparent;border:1.5px solid rgba(255,255,255,.6);color:#fff;}
.btn-outline-white:hover{background:rgba(255,255,255,.12);}
.btn-ghost{background:transparent;color:var(--navy);}
.btn-ghost:hover{background:var(--navy-soft);}
.btn-sm{padding:8px 16px;font-size:13px;border-radius:8px;}
.btn-block{width:100%;}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ===== Navbar ===== */
.navbar{
  position:sticky;top:0;z-index:100;background:rgba(255,255,255,.92);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--border);
}
.navbar-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 0;gap:20px;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:40px;width:auto;}
.brand-name{font-family:'Sora',sans-serif;font-weight:800;font-size:19px;color:var(--navy-dark);}
.brand-name span{color:var(--gold);}
.nav-links{display:flex;align-items:center;gap:28px;}
.nav-links a{font-size:14.5px;font-weight:600;color:var(--text-muted);transition:color .15s;}
.nav-links a:hover, .nav-links a.active{color:var(--navy);}
.nav-actions{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.nav-burger{display:none;background:none;border:none;font-size:24px;color:var(--navy);flex-shrink:0;}
.brand{min-width:0;}
.brand-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
@media (max-width:900px){
  .nav-links{position:fixed;top:65px;left:0;right:0;background:#fff;flex-direction:column;padding:20px 24px;border-bottom:1px solid var(--border);display:none;gap:16px;align-items:flex-start;max-height:calc(100vh - 65px);overflow-y:auto;z-index:99;}
  .nav-links.open{display:flex;}
  .nav-burger{display:block;}
  .nav-actions .btn, .nav-actions .navbar-userchip{display:none;}
  .nav-actions{gap:8px;}
}
@media (max-width:400px){
  .brand-name{font-size:15px;max-width:110px;}
}
.notif-bell-wrap{position:relative;}
.notif-bell{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;position:relative;flex-shrink:0;}
.notif-badge{position:absolute;top:-3px;right:-3px;background:#D64545;color:#fff;font-size:9.5px;font-weight:800;min-width:16px;height:16px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.notif-dropdown{position:absolute;top:46px;right:0;width:320px;max-width:88vw;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 40px rgba(12,44,116,.18);z-index:200;overflow:hidden;}
.notif-dropdown-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13.5px;}
.notif-item{padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;display:flex;gap:10px;}
.notif-item:last-child{border-bottom:none;}
.notif-item.unread{background:#F4F8FF;}
.notif-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex:0 0 auto;margin-top:5px;}
.notif-item .t{color:var(--text-muted);font-size:11.5px;margin-top:2px;}

/* wishlist heart */
.wishlist-btn{position:absolute;top:10px;right:10px;z-index:2;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.92);border:none;display:flex;align-items:center;justify-content:center;font-size:15px;color:#B23B3B;}
.wishlist-btn.active{background:#B23B3B;color:#fff;}

/* pagination */
.pagination{display:flex;gap:8px;justify-content:center;margin:36px 0 60px;flex-wrap:wrap;}
.page-btn{width:38px;height:38px;border-radius:9px;border:1.5px solid var(--border);background:#fff;font-weight:700;font-size:13.5px;color:var(--text-muted);}
.page-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.page-btn:disabled{opacity:.4;}

/* gallery slideshow */
.gallery-slideshow{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/7;}
@media (max-width:700px){.gallery-slideshow{aspect-ratio:16/11;}}
.gallery-slide{position:absolute;inset:0;display:flex;align-items:flex-end;padding:32px;opacity:0;transition:opacity .5s ease;color:#fff;}
.gallery-slide.active{opacity:1;}
.gallery-slide .cap{position:relative;z-index:1;}
.gallery-slide .cap h4{color:#fff;font-size:20px;margin:0 0 4px;}
.gallery-slide .cap p{margin:0;color:rgba(255,255,255,.8);font-size:13.5px;}
.gallery-slide .icon-big{position:absolute;right:24px;top:24px;font-size:38px;opacity:.5;}
.gallery-nav{position:absolute;bottom:18px;right:24px;display:flex;gap:8px;z-index:2;}
.gallery-dot{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.45);border:none;}
.gallery-dot.active{background:var(--gold);width:22px;border-radius:5px;}
.gallery-arrow{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;font-size:16px;z-index:2;}
.gallery-arrow.left{left:16px;}
.gallery-arrow.right{right:16px;}

/* articles */
.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:900px){.article-grid{grid-template-columns:1fr;}}
.article-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;display:flex;flex-direction:column;}
.article-thumb{height:140px;position:relative;display:flex;align-items:center;justify-content:center;font-size:34px;}
.article-body{padding:16px 18px;display:flex;flex-direction:column;gap:8px;flex:1;}
.article-tag{align-self:flex-start;font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--navy);background:var(--navy-soft);padding:4px 9px;border-radius:6px;}
.article-body h4{font-size:15px;margin:0;line-height:1.35;}
.article-body p{font-size:13px;color:var(--text-muted);margin:0;line-height:1.5;flex:1;}
.article-meta{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text-muted);margin-top:4px;}

/* reviews */
.review-item{border-bottom:1px solid var(--border);padding:18px 0;display:flex;gap:14px;}
.review-item:last-child{border-bottom:none;}
.review-body{flex:1;}
.review-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
.review-head b{font-size:13.5px;}
.review-date{font-size:11.5px;color:var(--text-muted);}
.review-body p{margin:6px 0 0;font-size:13.5px;color:var(--text-muted);line-height:1.6;}

/* quiz */
.quiz-shell{max-width:640px;margin:0 auto;}
.quiz-progress{display:flex;gap:6px;margin-bottom:24px;}
.quiz-progress > div{flex:1;height:6px;border-radius:999px;background:var(--border);}
.quiz-progress > div.done{background:var(--gold);}
.quiz-question{font-size:19px;margin:0 0 22px;}
.quiz-option{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1.5px solid var(--border);border-radius:12px;margin-bottom:12px;cursor:pointer;font-size:14.5px;}
.quiz-option:hover{border-color:var(--navy);}
.quiz-option.selected{border-color:var(--navy);background:var(--navy-soft);font-weight:600;}
.quiz-option.correct{border-color:var(--success);background:#E4F7EE;}
.quiz-option.wrong{border-color:#D64545;background:#FBEAEA;}
.quiz-letter{width:26px;height:26px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:0 0 auto;}
.quiz-result{text-align:center;padding:40px 20px;}
.quiz-result .score-circle{width:130px;height:130px;border-radius:50%;border:8px solid var(--gold);display:flex;align-items:center;justify-content:center;flex-direction:column;margin:0 auto 20px;}
.quiz-result .score-circle b{font-size:30px;font-family:'Sora',sans-serif;color:var(--navy-dark);}

/* checkout */
.checkout-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:start;}
@media (max-width:860px){.checkout-grid{grid-template-columns:1fr;}}
.pay-method{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.pay-method button{flex:1;min-width:140px;padding:14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;font-weight:700;font-size:13.5px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.pay-method button.active{border-color:var(--navy);background:var(--navy-soft);color:var(--navy);}
.order-summary{background:var(--surface);border-radius:16px;padding:22px;}
.order-row{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:10px;color:var(--text-muted);}
.order-row.total{border-top:1px solid var(--border);padding-top:12px;margin-top:6px;font-weight:800;color:var(--text);font-size:16px;}

/* 404 */
.error-page{min-height:calc(100vh - 200px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 20px;}
.error-code{font-family:'Sora',sans-serif;font-weight:800;font-size:110px;color:var(--navy-soft);line-height:1;}

/* teacher/admin extras */
.table-scroll{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;margin-bottom:4px;}
.data-table{width:100%;min-width:520px;border-collapse:collapse;font-size:13.5px;}
.data-table th{text-align:left;padding:12px 14px;background:var(--surface);color:var(--text-muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
.data-table td{padding:12px 14px;border-bottom:1px solid var(--border);}
.data-table tr:last-child td{border-bottom:none;}
.icon-btn{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:#fff;font-size:13px;}
.icon-btn:hover{background:var(--surface);}
.icon-btn.danger:hover{background:#FBEAEA;border-color:#D64545;color:#D64545;}
.status-pill{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;}
.status-pill.ok{background:#E4F7EE;color:var(--success);}
.status-pill.pending{background:#FDF0DA;color:#B57200;}
.status-pill.blocked{background:#FBEAEA;color:#D64545;}

/* topbar motto */
.topbar{background:var(--navy-dark);color:var(--gold);text-align:center;padding:7px 12px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;}
.topbar span{color:rgba(255,255,255,.6);margin:0 8px;}

/* cookie consent */
.cookie-banner{position:fixed;bottom:0;left:0;right:0;background:var(--navy-dark);color:#fff;padding:18px 24px;z-index:500;display:flex;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:0 -10px 30px rgba(0,0,0,.2);}
.cookie-banner p{margin:0;font-size:13px;color:rgba(255,255,255,.8);flex:1;min-width:220px;line-height:1.5;}
.cookie-banner .actions{display:flex;gap:10px;flex-wrap:wrap;}

/* image upload */
.upload-box{border:1.5px dashed var(--border);border-radius:12px;padding:16px;text-align:center;cursor:pointer;background:var(--surface);}
.upload-box:hover{border-color:var(--navy);}
.upload-preview{max-width:100%;max-height:140px;border-radius:10px;margin-top:10px;display:none;object-fit:cover;}
.upload-preview.show{display:inline-block;}
.file-input-hidden{display:none;}

/* review form */
.star-picker{display:flex;gap:6px;font-size:26px;margin-bottom:14px;}
.star-picker span{cursor:pointer;color:var(--border);}
.star-picker span.active{color:var(--gold);}

/* OTP */
.otp-row{display:flex;gap:10px;justify-content:center;margin-bottom:20px;}
.otp-row input{width:44px;height:52px;text-align:center;font-size:20px;font-weight:700;border:1.5px solid var(--border);border-radius:10px;}
.otp-row input:focus{border-color:var(--navy);}

/* module builder */
.builder-module-card{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
.quiz-q-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:12px;background:var(--surface);}
.quiz-q-card .opt-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.quiz-q-card .opt-row input[type="text"]{flex:1;}


/* ===== Hero ===== */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(180deg,#fff 0%, var(--surface) 100%);
  padding:64px 0 40px;
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;background:var(--navy-soft);color:var(--navy);
  font-weight:700;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:7px 14px;border-radius:999px;margin-bottom:20px;
}
.eyebrow::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--gold);}
.hero h1{font-size:46px;line-height:1.08;margin:0 0 18px;}
.hero h1 .accent{color:var(--gold);position:relative;}
.hero p.lead{font-size:17px;color:var(--text-muted);max-width:520px;margin:0 0 30px;line-height:1.6;}
.hero-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:36px;}
.hero-stats{display:flex;gap:36px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:'Sora',sans-serif;font-size:26px;color:var(--navy-dark);}
.hero-stat span{font-size:13px;color:var(--text-muted);}
.hero-visual{position:relative;}
.peak{
  position:relative;width:100%;aspect-ratio:1/1;max-width:440px;margin:0 auto;
}
.peak-shape{position:absolute;inset:0;}
.peak-card{
  position:absolute;background:#fff;border:1px solid var(--border);border-radius:16px;
  box-shadow:0 20px 40px rgba(12,44,116,.12);padding:16px 18px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:10px;
}
@media (max-width:900px){
  .hero-grid{grid-template-columns:1fr;}
  .hero h1{font-size:34px;}
  .hero-visual{order:-1;max-width:320px;margin:0 auto 20px;}
}

/* ===== Sections ===== */
.section{padding:64px 0;}
.section-alt{background:var(--surface);}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:36px;flex-wrap:wrap;}
.section-head h2{font-size:30px;margin:0 0 8px;}
.section-head p{color:var(--text-muted);margin:0;max-width:520px;font-size:15px;}
.tag-label{color:var(--gold);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em;}

/* ===== Course cards ===== */
.course-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:900px){.course-grid{grid-template-columns:repeat(2,1fr);}}
@media (max-width:640px){.course-grid{grid-template-columns:1fr;}}
.course-card{
  background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease;display:flex;flex-direction:column;
}
.course-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px rgba(12,44,116,.12);}
.course-thumb{
  height:150px;position:relative;display:flex;align-items:flex-end;padding:14px;
  background:linear-gradient(135deg,var(--navy) 0%, var(--navy-dark) 100%);
}
.course-thumb::after{
  content:"";position:absolute;right:-10px;top:-10px;width:90px;height:90px;
  background:var(--gold);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.9;
}
.course-cat{position:relative;z-index:1;color:#fff;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:999px;}
.course-body{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1;}
.course-tags{display:flex;gap:8px;flex-wrap:wrap;}
.badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.03em;}
.badge-free{background:#E4F7EE;color:var(--success);}
.badge-paid{background:#FDF0DA;color:#B57200;}
.badge-diplome{background:var(--navy-soft);color:var(--navy);}
.badge-certificat{background:#FBEAD2;color:#8A5A00;}
.course-body h3{font-size:16.5px;margin:0;line-height:1.3;}
.course-meta{display:flex;align-items:center;gap:14px;font-size:12.5px;color:var(--text-muted);}
.course-foot{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:8px;border-top:1px solid var(--border);}
.price{font-family:'Sora',sans-serif;font-weight:700;color:var(--navy-dark);font-size:15px;}
.price.free{color:var(--success);}
.stars{color:var(--gold);font-size:13px;}

/* ===== Programs ===== */
.program-cards{display:grid;grid-template-columns:1fr 1fr;gap:24px;}
@media (max-width:800px){.program-cards{grid-template-columns:1fr;}}
.program-card{
  border-radius:18px;padding:32px;position:relative;overflow:hidden;color:#fff;min-height:220px;
  display:flex;flex-direction:column;justify-content:space-between;
}
.program-card.cert{background:linear-gradient(135deg,var(--navy) 0%,#123A94 100%);}
.program-card.diplome{background:linear-gradient(135deg,#B57200 0%, var(--gold) 100%);}
.program-card h3{color:#fff;font-size:24px;margin:0 0 8px;}
.program-card p{color:rgba(255,255,255,.85);font-size:14px;margin:0 0 20px;max-width:360px;}
.program-icon{position:absolute;right:-20px;bottom:-20px;width:140px;height:140px;opacity:.15;
  clip-path:polygon(50% 0,100% 100%,0 100%);background:#fff;}

/* ===== Carousel ===== */
.carousel-wrap{position:relative;}
.carousel-track{display:flex;gap:22px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;scrollbar-width:none;}
.carousel-track::-webkit-scrollbar{display:none;}
.carousel-track > *{scroll-snap-align:start;flex:0 0 auto;}
.carousel-nav{display:flex;gap:10px;margin-top:16px;justify-content:center;}
.carousel-nav button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:#fff;color:var(--navy);font-size:16px;display:flex;align-items:center;justify-content:center;}
.carousel-nav button:hover{background:var(--navy-soft);}

.instructor-card{
  width:230px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:20px;text-align:center;
}
.avatar{width:76px;height:76px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:700;font-size:22px;color:#fff;background:var(--navy);}
.instructor-card h4{margin:0 0 3px;font-size:15px;}
.instructor-card .role{font-size:12.5px;color:var(--gold);font-weight:700;margin-bottom:8px;}
.instructor-card p{font-size:12.5px;color:var(--text-muted);margin:0;line-height:1.5;}

.testimonial-card{
  width:340px;background:#fff;border:1px solid var(--border);border-radius:16px;padding:24px;
}
.testimonial-card .quote{font-size:14px;color:var(--text);line-height:1.6;margin-bottom:16px;}
.testimonial-who{display:flex;align-items:center;gap:12px;}
.testimonial-who .avatar{width:42px;height:42px;font-size:14px;margin:0;}
.testimonial-who b{display:block;font-size:13.5px;}
.testimonial-who span{font-size:12px;color:var(--text-muted);}

/* ===== News ===== */
.news-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
@media (max-width:900px){.news-grid{grid-template-columns:1fr;}}
.news-card{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:#fff;}
.news-thumb{height:130px;background:var(--surface);position:relative;}
.news-thumb .tri{position:absolute;bottom:0;right:0;width:0;height:0;border-style:solid;border-width:0 0 70px 90px;border-color:transparent transparent var(--gold) transparent;opacity:.5;}
.news-body{padding:16px 18px;}
.news-date{font-size:11.5px;color:var(--gold);font-weight:700;text-transform:uppercase;}
.news-body h4{font-size:15px;margin:8px 0 6px;}
.news-body p{font-size:13px;color:var(--text-muted);margin:0;line-height:1.5;}

/* ===== CTA banner ===== */
.cta-banner{
  background:var(--navy);border-radius:20px;padding:48px;text-align:center;position:relative;overflow:hidden;color:#fff;
}
.cta-banner::before{content:"";position:absolute;top:-60px;left:-60px;width:200px;height:200px;background:var(--gold);opacity:.15;clip-path:polygon(50% 0,100% 100%,0 100%);}
.cta-banner h2{color:#fff;font-size:28px;margin:0 0 10px;}
.cta-banner p{color:rgba(255,255,255,.8);margin:0 0 24px;}

/* ===== Footer ===== */
footer{background:var(--navy-dark);color:rgba(255,255,255,.75);padding:56px 0 24px;margin-top:40px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:36px;}
@media (max-width:800px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer-brand img{height:34px;margin-bottom:14px;}
.footer-brand p{font-size:13px;line-height:1.6;max-width:280px;color:rgba(255,255,255,.6);}
footer h5{color:#fff;font-size:13.5px;text-transform:uppercase;letter-spacing:.05em;margin:0 0 16px;}
footer ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:11px;}
footer a{font-size:13.5px;color:rgba(255,255,255,.65);transition:color .15s;}
footer a:hover{color:var(--gold);}
.footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:20px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12.5px;color:rgba(255,255,255,.5);}
.social-row{display:flex;gap:10px;}
.social-row a{width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:13px;}
.social-row a:hover{background:var(--gold);color:var(--navy-dark);border-color:var(--gold);}

/* ===== Auth pages ===== */
.auth-wrap{min-height:calc(100vh - 140px);display:flex;align-items:center;justify-content:center;padding:48px 20px;background:var(--surface);}
.auth-card{background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(12,44,116,.10);max-width:440px;width:100%;padding:38px 34px;}
.auth-logo{display:flex;justify-content:center;margin-bottom:18px;}
.auth-logo img{height:48px;}
.auth-card h2{text-align:center;font-size:23px;margin:0 0 6px;}
.auth-card .sub{text-align:center;color:var(--text-muted);font-size:13.5px;margin:0 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text);}
.field input, .field select, .field textarea{
  width:100%;padding:11px 13px;border:1.5px solid var(--border);border-radius:9px;font-size:14px;font-family:inherit;
  transition:border-color .15s;background:#fff;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--navy);}
.phone-row{display:flex;gap:8px;}
.phone-row select{flex:0 0 100px;}
.social-auth{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.social-btn{
  display:flex;align-items:center;justify-content:center;gap:10px;padding:11px;border:1.5px solid var(--border);
  border-radius:9px;font-weight:600;font-size:14px;background:#fff;
}
.social-btn:hover{background:var(--surface);}
.divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:var(--text-muted);font-size:12.5px;}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border);}
.auth-switch{text-align:center;font-size:13.5px;color:var(--text-muted);margin-top:20px;}
.auth-switch a{color:var(--navy);font-weight:700;}
.method-toggle{display:flex;background:var(--surface);border-radius:10px;padding:4px;margin-bottom:22px;}
.method-toggle button{flex:1;border:none;background:transparent;padding:9px;border-radius:8px;font-weight:600;font-size:13px;color:var(--text-muted);}
.method-toggle button.active{background:#fff;color:var(--navy);box-shadow:0 2px 6px rgba(12,44,116,.12);}

/* step indicator */
.steps{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:28px;}
.step-dot{width:30px;height:30px;border-radius:50%;background:var(--surface);color:var(--text-muted);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:1.5px solid var(--border);}
.step-dot.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.step-dot.done{background:var(--success);color:#fff;border-color:var(--success);}
.step-line{width:34px;height:2px;background:var(--border);}
.avatar-upload{width:90px;height:90px;border-radius:50%;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:12px;color:var(--text-muted);text-align:center;cursor:pointer;}
.chip-select{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:8px 14px;border-radius:999px;border:1.5px solid var(--border);font-size:12.5px;font-weight:600;color:var(--text-muted);}
.chip.selected{background:var(--navy);border-color:var(--navy);color:#fff;}

/* ===== Courses page ===== */
.page-header{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);padding:50px 0 70px;color:#fff;position:relative;overflow:hidden;}
.page-header::after{content:"";position:absolute;right:-40px;top:-40px;width:220px;height:220px;background:var(--gold);opacity:.18;clip-path:polygon(50% 0,100% 100%,0 100%);}
.page-header h1{color:#fff;font-size:32px;margin:0 0 10px;}
.page-header p{color:rgba(255,255,255,.75);max-width:560px;margin:0;font-size:15px;}
.search-bar{
  background:#fff;border-radius:14px;box-shadow:0 16px 40px rgba(12,44,116,.16);padding:10px;display:flex;gap:8px;
  margin-top:-30px;position:relative;z-index:5;
}
.search-bar input{flex:1;border:none;padding:12px 16px;font-size:14.5px;border-radius:10px;}
.search-bar input:focus{outline:none;background:var(--surface);}
.filters-row{display:flex;gap:10px;flex-wrap:wrap;margin:26px 0;align-items:center;}
.filter-chip{padding:9px 16px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:13px;font-weight:600;color:var(--text-muted);}
.filter-chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.filter-chip.gold-active{background:var(--gold);color:var(--navy-dark);border-color:var(--gold);}
.results-count{font-size:13.5px;color:var(--text-muted);margin-bottom:18px;}

/* ===== Course detail ===== */
.course-hero{background:var(--navy-dark);color:#fff;padding:44px 0 40px;}
.course-hero-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:40px;align-items:start;}
@media (max-width:900px){.course-hero-grid{grid-template-columns:1fr;}}
.course-hero h1{color:#fff;font-size:30px;margin:10px 0 14px;}
.course-hero p{color:rgba(255,255,255,.78);font-size:15px;line-height:1.6;max-width:600px;}
.course-side-card{background:#fff;border-radius:16px;padding:22px;color:var(--text);box-shadow:0 20px 40px rgba(0,0,0,.2);}
.video-frame{background:#0a1a3f;border-radius:12px;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:13px;margin-bottom:16px;position:relative;overflow:hidden;}
.play-btn{width:56px;height:56px;border-radius:50%;background:var(--gold);color:var(--navy-dark);display:flex;align-items:center;justify-content:center;font-size:20px;}

.tabs{display:flex;gap:4px;border-bottom:1.5px solid var(--border);margin:32px 0 24px;overflow-x:auto;}
.tab-btn{padding:12px 18px;font-weight:700;font-size:14px;color:var(--text-muted);border-bottom:2.5px solid transparent;white-space:nowrap;}
.tab-btn.active{color:var(--navy);border-color:var(--gold);}

.module{border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden;}
.module-head{display:flex;align-items:center;justify-content:between;gap:12px;padding:16px 18px;background:var(--surface);cursor:pointer;}
.module-head-left{display:flex;align-items:center;gap:12px;flex:1;}
.module-num{width:30px;height:30px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex:0 0 auto;}
.module-head h4{margin:0;font-size:14.5px;}
.module-head .status{font-size:11.5px;color:var(--text-muted);}
.module-body{padding:18px 20px;display:none;border-top:1px solid var(--border);}
.module-body.open{display:block;}
.module-step{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--border);}
.module-step:last-child{border-bottom:none;}
.step-icon{width:26px;height:26px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:12px;flex:0 0 auto;}
.step-icon.locked{background:#F1F1F4;color:#B4B8C4;}
.step-icon.done{background:var(--success);color:#fff;}
.step-content{flex:1;}
.step-content h5{margin:0 0 4px;font-size:13.5px;}
.step-content p{margin:0 0 8px;font-size:12.5px;color:var(--text-muted);line-height:1.5;}
.locked-text{color:#B4B8C4;font-size:12.5px;font-style:italic;}

.instructor-strip{display:flex;align-items:center;gap:14px;padding:18px;background:var(--surface);border-radius:14px;margin-top:24px;}
.progress-bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin:10px 0;}
.progress-bar > div{height:100%;background:linear-gradient(90deg,var(--gold),var(--navy));}

/* Become teacher */
.split-hero{display:grid;grid-template-columns:1fr 1fr;gap:44px;align-items:center;padding:60px 0;}
@media (max-width:900px){.split-hero{grid-template-columns:1fr;}}
.step-list{display:flex;flex-direction:column;gap:22px;margin-top:20px;}
.step-item{display:flex;gap:16px;}
.step-item .num{width:38px;height:38px;border-radius:10px;background:var(--navy-soft);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Sora',sans-serif;flex:0 0 auto;}
.step-item h4{margin:0 0 4px;font-size:15.5px;}
.step-item p{margin:0;font-size:13.5px;color:var(--text-muted);line-height:1.5;}

.hidden{display:none !important;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy-dark);color:#fff;padding:14px 20px;border-radius:10px;font-size:13.5px;box-shadow:0 12px 30px rgba(0,0,0,.25);z-index:999;display:flex;align-items:center;gap:10px;}
.small-muted{font-size:12.5px;color:var(--text-muted);}

/* ===== Dashboard ===== */
.dash-shell{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 200px);}
@media (max-width:860px){.dash-shell{grid-template-columns:1fr;}}
.dash-sidebar{background:var(--surface);border-right:1px solid var(--border);padding:28px 18px;}
@media (max-width:860px){.dash-sidebar{border-right:none;border-bottom:1px solid var(--border);padding:14px 14px 10px;}}
.dash-user{display:flex;align-items:center;gap:12px;padding:0 8px 20px;margin-bottom:16px;border-bottom:1px solid var(--border);}
@media (max-width:860px){.dash-user{padding:0 4px 12px;margin-bottom:10px;}}
.dash-user b{display:block;font-size:14px;}
.dash-user span{font-size:12px;color:var(--text-muted);}
.dash-nav{display:flex;flex-direction:column;gap:4px;}
@media (max-width:860px){
  .dash-nav{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;gap:6px;padding-bottom:6px;}
  .dash-nav a{flex:0 0 auto;white-space:nowrap;padding:9px 13px;font-size:13px;}
  .dash-nav .logout{margin-top:0;padding-top:0;border-top:none;border-left:1px solid var(--border);padding-left:14px;}
}
.dash-nav a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:9px;font-size:14px;font-weight:600;color:var(--text-muted);}
.dash-nav a:hover{background:#fff;}
.dash-nav a.active{background:var(--navy);color:#fff;}
.dash-nav .logout{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);color:#B23B3B;}
.dash-main{padding:32px;background:#fff;}
@media (max-width:860px){.dash-main{padding:22px;}}
.dash-welcome{background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);border-radius:16px;padding:26px 28px;color:#fff;margin-bottom:28px;position:relative;overflow:hidden;}
.dash-welcome::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;background:var(--gold);opacity:.18;clip-path:polygon(50% 0,100% 100%,0 100%);}
.dash-welcome h2{color:#fff;margin:0 0 6px;font-size:22px;}
.dash-welcome p{color:rgba(255,255,255,.75);margin:0;font-size:13.5px;}
.dash-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px;}
@media (max-width:700px){.dash-stats{grid-template-columns:1fr 1fr;}}
.dash-stat-card{border:1px solid var(--border);border-radius:14px;padding:18px;}
.dash-stat-card b{display:block;font-family:'Sora',sans-serif;font-size:24px;color:var(--navy-dark);}
.dash-stat-card span{font-size:12.5px;color:var(--text-muted);}
.enrolled-card{border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;gap:16px;align-items:center;margin-bottom:14px;}
@media (max-width:600px){.enrolled-card{flex-wrap:wrap;}}
.enrolled-thumb{width:60px;height:60px;border-radius:12px;flex:0 0 auto;background:linear-gradient(135deg,var(--navy),var(--navy-dark));display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:20px;}
.enrolled-info{flex:1;min-width:180px;}
.enrolled-info h4{margin:0 0 4px;font-size:14.5px;}
.enrolled-info .progress-bar{margin:8px 0 4px;}
.cert-card{border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;align-items:center;gap:14px;margin-bottom:12px;}
.cert-icon{width:44px;height:44px;border-radius:10px;background:#FBEAD2;color:#B57200;display:flex;align-items:center;justify-content:center;font-size:20px;flex:0 0 auto;}
.cert-icon.pending{background:#F1F1F4;color:#9AA0AE;}
</style>
</head>

const SUPABASE_URL = "https://gyxejnbthlebpomyismk.supabase.co";
const SUPABASE_KEY = "sb_publishable_EzZ5fjYdlKi8pHwiczvGPA_lejMwDMJ";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let CURRENT_PROFILE = null; // {id, full_name, email, role, ...}

async function sbLoadProfile(userId){
  const { data, error } = await sb.from('profiles').select('*').eq('id', userId).single();
  if(error){ console.error(error); return null; }
  return data;
}

async function sbRestoreSession(){
  const { data: { session } } = await sb.auth.getSession();
  if(session && session.user){
    const profile = await sbLoadProfile(session.user.id);
    if(profile){
      CURRENT_PROFILE = profile;
      state.loggedIn = true;
      state.currentUser = { name: profile.full_name || profile.email, email: profile.email };
    }
  }
  await sbLoadPublicContent();
  render();
}

async function resendConfirmationEmail(){
  const btn = document.getElementById('resendBtn');
  const statusEl = document.getElementById('resendStatus');
  if(!state.regDraft.email){ return; }
  btn.disabled = true; btn.textContent = 'Envoi...';
  const { error } = await sb.auth.resend({ type: 'signup', email: state.regDraft.email });
  btn.disabled = false; btn.textContent = "Renvoyer l'e-mail de confirmation";
  statusEl.classList.remove('hidden');
  statusEl.style.color = error ? '#D64545' : 'var(--success)';
  statusEl.style.background = error ? '#FBEAEA' : '#E4F7EE';
  statusEl.textContent = error ? ('Erreur : ' + error.message) : 'E-mail renvoyé !';
}

// Catch the moment a user clicks the confirmation link in their email and lands back here
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'SIGNED_IN' && session && session.user && !CURRENT_PROFILE){
    sbLoadProfile(session.user.id).then(profile => {
      if(profile){
        CURRENT_PROFILE = profile;
        state.loggedIn = true;
        state.currentUser = { name: profile.full_name || profile.email, email: profile.email };
        // Clean the auth tokens out of the URL bar
        if(window.location.hash.includes('access_token')) history.replaceState(null, '', window.location.pathname);
        routeAfterLogin();
      }
    });
  }
  if(event === 'SIGNED_OUT'){
    CURRENT_PROFILE = null;
    state.loggedIn = false;
  }
});

async function sbSignUp(email, password, fullName){
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
  if(error){ alert("Erreur d'inscription : " + error.message); return false; }
  if(data.user){
    // Profile row is created by DB trigger; fetch it (may need a brief retry if trigger hasn't run yet)
    let profile = await sbLoadProfile(data.user.id);
    if(!profile){ await new Promise(r=>setTimeout(r,600)); profile = await sbLoadProfile(data.user.id); }
    CURRENT_PROFILE = profile;
    state.loggedIn = true;
    state.currentUser = { name: fullName || email, email };
  }
  return true;
}

async function sbSignIn(email, password){
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ alert("Erreur de connexion : " + error.message); return false; }
  const profile = await sbLoadProfile(data.user.id);
  CURRENT_PROFILE = profile;
  state.loggedIn = true;
  state.currentUser = { name: (profile && profile.full_name) || email, email };
  return true;
}

async function sbSignOut(){
  await sb.auth.signOut();
  CURRENT_PROFILE = null;
  state.loggedIn = false;
}

function routeAfterLogin(){
  if(!CURRENT_PROFILE){ go('dashboard'); return; }
  if(CURRENT_PROFILE.role === 'admin') go('admin-dashboard');
  else if(CURRENT_PROFILE.role === 'teacher') go('teacher-dashboard');
  else go('dashboard');
}

/* Map a Supabase course row (with joined instructor + modules + quiz_questions) to the shape the UI expects */
function mapDbCourse(row){
  return {
    id: row.id,
    title: row.title,
    cat: row.category,
    price: Number(row.price_usd),
    free: Number(row.price_usd) === 0,
    level: row.level,
    duration: row.duration_text,
    weeks: row.weeks,
    lang: row.lang,
    rating: Number(row.rating) || 0,
    students: row.students_count || 0,
    instructor: row.instructor ? row.instructor.full_name : 'Formateur JC Academy',
    instructorId: row.instructor_id,
    desc: row.description,
    color: (typeof row.id === 'string' ? row.id.charCodeAt(0) : row.id) % 6,
    image: row.cover_image_url || '',
    modules: (row.modules || []).sort((a,b)=>a.position-b.position).map(m => ({
      id: m.id,
      title: m.title,
      theory: m.theory,
      videoUrl: m.video_url,
      quiz: (m.quiz_questions || []).sort((a,b)=>a.position-b.position).map(q => ({
        q: q.question, options: q.options, correct: q.correct_index
      })),
    })),
  };
}

async function sbLoadCourses(){

/* ===================== IMAGE UPLOAD (real file upload, in-memory as data URL) ===================== */
function previewImage(fileInput, previewId, hiddenId){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const dataUrl = e.target.result;
    const preview = document.getElementById(previewId);
    const hidden = document.getElementById(hiddenId);
    if(preview){ preview.src = dataUrl; preview.classList.add('show'); }
    if(hidden){ hidden.value = dataUrl; }
  };
  reader.readAsDataURL(file);
}
function imageUploadField(idPrefix, label){
  return `
  <div class="field">
    <label>${label}</label>
    <label class="upload-box" for="${idPrefix}File">
      📁 Cliquez pour choisir une image (ou glissez-la ici)
      <img id="${idPrefix}Preview" class="upload-preview" alt="Aperçu">
    </label>
    <input type="file" accept="image/*" id="${idPrefix}File" class="file-input-hidden" onchange="previewImage(this,'${idPrefix}Preview','${idPrefix}Data')">
    <input type="hidden" id="${idPrefix}Data" value="">
    <p class="small-muted" style="margin-top:6px;">Ou collez une URL d'image :</p>
    <input type="text" id="${idPrefix}Url" placeholder="https://...">
  </div>`;
}
function getUploadedImage(idPrefix){
  const dataVal = document.getElementById(idPrefix+'Data')?.value;
  const urlVal = document.getElementById(idPrefix+'Url')?.value;
  return dataVal || urlVal || '';
}
function imageUploadFieldAvatar(idPrefix){
  return `
  <div style="text-align:center;margin-bottom:20px;">
    <label for="${idPrefix}File" style="cursor:pointer;display:inline-block;">
      <img id="${idPrefix}Preview" src="" alt="" style="display:none;width:90px;height:90px;border-radius:50%;object-fit:cover;margin:0 auto;">
      <div id="${idPrefix}Placeholder" class="avatar-upload">Ajouter<br>une photo</div>
    </label>
    <input type="file" accept="image/*" id="${idPrefix}File" class="file-input-hidden" onchange="previewAvatar(this,'${idPrefix}Preview','${idPrefix}Placeholder','${idPrefix}Data')">
    <input type="hidden" id="${idPrefix}Data" value="">
  </div>`;
}
function previewAvatar(fileInput, previewId, placeholderId, hiddenId){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    const preview = document.getElementById(previewId);
    const placeholder = document.getElementById(placeholderId);
    const hidden = document.getElementById(hiddenId);
    if(preview){ preview.src = e.target.result; preview.style.display='block'; }
    if(placeholder){ placeholder.style.display='none'; }
    if(hidden){ hidden.value = e.target.result; }
  };
  reader.readAsDataURL(file);

/* ===================== RECEIPT DOWNLOAD ===================== */
function downloadReceiptText(payment){
  const lines = [
    "================================",
    "        JC ACADEMY",
    "   Reçu de paiement officiel",
    "================================",
    "",
    `Référence : ${payment.id}`,
    `Date : ${payment.date}`,
    `Cours : ${payment.course}`,
    `Méthode de paiement : ${payment.method}`,
    `Montant : ${payment.amount ? (String(payment.method).includes('USD') ? fmtUSD(payment.amount) : fmtHTG(payment.amount)) : 'Gratuit'}`,
    `Statut : ${payment.status}`,
    "",
    `Facturé à : ${state.currentUser.name} (${state.currentUser.email})`,
    "",
    "--------------------------------",
    "Merci de votre confiance.",
    `${SITE_CONTENT.contactAddress} · ${SITE_CONTENT.contactPhone}`,
    `${SITE_CONTENT.contactEmail}`,
    "================================",
  ];
  const blob = new Blob([lines.join('\n')], {type:'text/plain;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Recu-${payment.id}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function downloadReceiptById(id){
  const p = PAYMENTS.find(x=>x.id===id);
  if(p) downloadReceiptText(p);
}

function fmtPrice(p){
  if(p===0) return "Gratuit";
  const htg = Math.round(p*EXCHANGE_RATE);
  return `$${p} USD · ${htg.toLocaleString('fr-FR')} HTG`;
}
function fmtUSD(p){ return p===0 ? "Gratuit" : `$${p} USD`; }
function fmtHTG(p){ return p===0 ? "Gratuit" : `${Math.round(p*EXCHANGE_RATE).toLocaleString('fr-FR')} HTG`; }
function initials(name){
  return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
}
const palette = ['#0C2C74','#123A94','#B57200','#1D9A6C','#7A3E9D','#B23B3B'];

async function toggleWishlist(id, ev){
  if(ev){ev.preventDefault();ev.stopPropagation();}
  if(!CURRENT_PROFILE){ go('login'); return; }
  const i = state.wishlist.indexOf(id);
  if(i>-1){
    state.wishlist.splice(i,1);
    renderApp();
    await sb.from('wishlists').delete().eq('student_id', CURRENT_PROFILE.id).eq('course_id', id);
  } else {
    state.wishlist.push(id);
    renderApp();
    await sb.from('wishlists').insert({ student_id: CURRENT_PROFILE.id, course_id: id });
  }
}

    if(state.filterDuration==='short' && c.weeks>4) return false;

let CURRENT_MODULE_PROGRESS = {}; // { [module_db_id]: {theory_read, video_watched, quiz_passed, quiz_score} }

async function sbLoadModuleProgress(courseId){
  CURRENT_MODULE_PROGRESS = {};
  if(!CURRENT_PROFILE) return;
  const { data } = await sb.from('module_progress').select('*').eq('student_id', CURRENT_PROFILE.id).eq('course_id', courseId);
  if(data) data.forEach(row => { CURRENT_MODULE_PROGRESS[row.module_id] = row; });
}

async function markTheoryRead(courseId, moduleDbId){
  if(!CURRENT_PROFILE){ go('login'); return; }
  await sb.from('module_progress').upsert(
    { student_id: CURRENT_PROFILE.id, course_id: courseId, module_id: moduleDbId, theory_read: true },
    { onConflict: 'student_id,module_id' }
  );
  await sbLoadModuleProgress(courseId);
  renderApp();
}
async function markVideoWatched(courseId, moduleDbId, videoUrl){
  if(videoUrl) window.open(videoUrl, '_blank');
  if(!CURRENT_PROFILE) return;
  await sb.from('module_progress').upsert(
    { student_id: CURRENT_PROFILE.id, course_id: courseId, module_id: moduleDbId, video_watched: true },
    { onConflict: 'student_id,module_id' }
  );
  await sbLoadModuleProgress(courseId);
  renderApp();
}

async function enrollFree(courseId){
  if(!CURRENT_PROFILE){ go('login'); return; }
  if(!ENROLLED.some(e=>e.courseId===courseId)){
    ENROLLED.push({courseId, progress:0}); // optimistic
    const { error } = await sb.from('enrollments').insert({ student_id: CURRENT_PROFILE.id, course_id: courseId, progress: 0 });
    if(error && error.code !== '23505'){ alert("Erreur lors de l'inscription : " + error.message); }
  }
  await loadStudentData();
  go('dashboard');
}
function setReviewStars(n){
  document.getElementById('reviewStarValue').value = n;
  document.querySelectorAll('#reviewStarPicker span').forEach(el=>{
    el.classList.toggle('active', parseInt(el.dataset.val)<=n);
  });
}
async function submitReview(courseId){
  if(!CURRENT_PROFILE){ go('login'); return; }
  const stars = parseInt(document.getElementById('reviewStarValue').value)||0;
  const comment = document.getElementById('reviewComment').value.trim();
  if(stars===0) return alert('Merci de sélectionner une note en étoiles.');
  if(!comment) return alert('Merci de rédiger un commentaire.');
  const { error } = await sb.from('reviews').upsert({
    student_id: CURRENT_PROFILE.id, course_id: courseId, rating: stars, comment,
  }, { onConflict: 'student_id,course_id' });
  if(error){ alert("Erreur lors de l'envoi de l'avis : " + error.message); return; }
  if(!REVIEWS[courseId]) REVIEWS[courseId] = [];
  REVIEWS[courseId].unshift({name: state.currentUser.name, init: initials(state.currentUser.name), rating: stars, date: "À l'instant", comment});
  await sbLoadCourses(); // pick up the DB-recalculated average rating
  alert('Merci pour votre avis !');
  renderApp();
}

async function handleLoginClick(){
  const btn = document.getElementById('loginBtn');
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if(!email || !password){ document.getElementById('loginError').textContent = 'Merci de renseigner e-mail et mot de passe.'; document.getElementById('loginError').classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'Connexion...';
  const ok = await sbSignIn(email, password);
  btn.disabled = false; btn.textContent = 'Se connecter';
  if(ok) routeAfterLogin();

async function handleRegisterStep1(){
  const fullName = document.getElementById('regFullName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const password = document.getElementById('regPassword').value;
  const errEl = document.getElementById('regError');
  if(!fullName || !email || !password || password.length < 6){
    errEl.textContent = 'Merci de remplir tous les champs (mot de passe : 6 caractères minimum).';
    errEl.classList.remove('hidden');
    return;
  }
  state.regDraft = { fullName, email };
  const btn = document.getElementById('regStep1Btn');
  btn.disabled = true; btn.textContent = 'Création du compte...';
  const { data, error } = await sb.auth.signUp({ email, password, options: { data: { full_name: fullName } } });
  btn.disabled = false; btn.textContent = 'Créer mon compte';
  if(error){ errEl.textContent = error.message; errEl.classList.remove('hidden'); return; }
  if(data.session){
    // Auto-confirmed: profile already created by DB trigger
    let profile = await sbLoadProfile(data.user.id);
    if(!profile){ await new Promise(r=>setTimeout(r,600)); profile = await sbLoadProfile(data.user.id); }
    CURRENT_PROFILE = profile;
    state.loggedIn = true;
    state.currentUser = { name: fullName, email };
    state.regStep = 2;
    renderApp();
  } else {
    state.regStep = 'pending-confirm';
    renderApp();
  }
}
async function handleRegisterStep2(){
  const phone = document.getElementById('regPhone').value.trim();
  const city = document.getElementById('regCity').value;
  if(CURRENT_PROFILE){
    await sb.from('profiles').update({ phone, city }).eq('id', CURRENT_PROFILE.id);
    CURRENT_PROFILE.phone = phone; CURRENT_PROFILE.city = city;
  }
  state.regStep = 3;
  renderApp();
}
async function handleRegisterFinish(){
  const bio = document.getElementById('regBio').value.trim();
  const avatarUrl = document.getElementById('regAvatarData') ? document.getElementById('regAvatarData').value : '';
  const btn = document.getElementById('regFinishBtn');
  btn.disabled = true; btn.textContent = 'Enregistrement...';
  if(CURRENT_PROFILE){
    const updates = { bio };
    if(avatarUrl) updates.avatar_url = avatarUrl;
    await sb.from('profiles').update(updates).eq('id', CURRENT_PROFILE.id);
  }
  routeAfterLogin();
}

  if(!CURRENT_PROFILE){ go('login'); return; }
  const invoiceId = 'INV-'+new Date().getFullYear()+'-'+Math.floor(1000+Math.random()*9000);
  const { error: enrErr } = await sb.from('enrollments').upsert(
    { student_id: CURRENT_PROFILE.id, course_id: courseId, progress: 0 },
    { onConflict: 'student_id,course_id' }
  );
  const { error: payErr } = await sb.from('payments').insert({
    invoice_ref: invoiceId, student_id: CURRENT_PROFILE.id, course_id: courseId,
    amount: c.price, currency: currency==='htg' ? 'HTG' : 'USD', method: methodLabel, status: 'paye',
  });
  if(enrErr || payErr){ alert('Erreur lors du paiement : ' + ((enrErr||payErr).message)); return; }
  const paymentRecord = {id:invoiceId, course:c.title, date:"Aujourd'hui", amount:c.price, method: methodLabel + (currency==='htg' ? ' (HTG)' : ' (USD)'), status:'Payé'};
  await loadStudentData();
  if(confirm('Paiement réussi ! Vous êtes maintenant inscrit au cours.\n\nTélécharger votre reçu maintenant ?')){
    downloadReceiptText(paymentRecord);
  }
  go('dashboard',{dashTab:'courses'});
}

/* ===================== QUIZ PAGE ===================== */
const QUIZ_BANK = [
  {q:"Quelle est la première étape avant de regarder la vidéo d'un module ?", options:["Passer le quiz","Lire la partie théorique","Soumettre le projet final","Demander le certificat"], correct:1},
  {q:"Quel est le délai moyen de correction d'un examen final ?", options:["1 à 2 jours ouvrés","1 heure","1 mois","Immédiat"], correct:0},
  {q:"Comment recevez-vous votre certificat ?", options:["Par courrier postal","Par SMS","Par e-mail","Il faut le récupérer sur place"], correct:2},
  {q:"Que devez-vous faire à la fin de tous les modules ?", options:["Rien, le cours est terminé","Un examen final ou un projet à soumettre","Recommencer le cours","Payer à nouveau"], correct:1},
];
function renderQuiz(){
  const c = COURSES.find(x=>x.id===state.courseId) || COURSES[0];
  const realModule = c.modules && c.modules.find(m=>m.id===state.moduleId);
  const activeBank = (realModule && realModule.quiz && realModule.quiz.length) ? realModule.quiz : QUIZ_BANK;
  const q = activeBank[state.quizIndex] || activeBank[0];
  const total = activeBank.length;

  if(state.quizSubmitted){
    let score = 0;
    activeBank.forEach((qq,i)=>{ if(state.quizAnswers[i]===qq.correct) score++; });
    const pct = Math.round(score/total*100);
    return `
    <div class="container" style="padding:60px 24px;">
      <div class="quiz-shell">
        <div class="quiz-result">
          <div class="score-circle"><b>${pct}%</b><span class="small-muted">Score</span></div>
          <h2>${pct>=60 ? 'Quiz réussi ! 🎉' : 'Quiz non validé'}</h2>
          <p class="small-muted">${score} bonnes réponses sur ${total}. ${pct>=60 ? 'Le module suivant est maintenant débloqué.' : 'Revisionnez la vidéo puis retentez le quiz.'}</p>
          <div style="display:flex;gap:12px;justify-content:center;margin-top:20px;">
            <button class="btn btn-outline" onclick="go('course-detail',{courseId:'${c.id}'})">Retour au cours</button>
            ${pct<60 ? `<button class="btn btn-primary" onclick="go('quiz',{courseId:'${c.id}',moduleId:'${state.moduleId}',quizIndex:0,quizAnswers:{},quizSubmitted:false})">Recommencer</button>`:''}
          </div>
        </div>
      </div>
    </div>`;
  }

  return `
  <div class="container" style="padding:44px 24px 70px;">
    <div class="quiz-shell">
      <a href="#" onclick="go('course-detail',{courseId:'${c.id}'});return false;" style="font-size:13px;color:var(--text-muted);">&larr; Quitter le quiz</a>
      <h2 style="margin:14px 0 6px;">Quiz${realModule?' — '+realModule.title:''}</h2>
      <p class="small-muted" style="margin:0 0 20px;">Question ${state.quizIndex+1} sur ${total}</p>
      <div class="quiz-progress">${activeBank.map((_,i)=>`<div class="${i<=state.quizIndex?'done':''}"></div>`).join('')}</div>
      <p class="quiz-question">${q.q}</p>
      ${q.options.map((opt,i)=>`
        <div class="quiz-option ${state.quizAnswers[state.quizIndex]===i?'selected':''}" onclick="state.quizAnswers[${state.quizIndex}]=${i};renderApp();">
          <span class="quiz-letter">${String.fromCharCode(65+i)}</span> ${opt}
        </div>`).join('')}
      <div style="display:flex;justify-content:space-between;margin-top:24px;">
        <button class="btn btn-outline" ${state.quizIndex===0?'disabled':''} onclick="state.quizIndex--;renderApp();">Précédent</button>
        ${state.quizIndex<total-1 ?
          `<button class="btn btn-primary" ${state.quizAnswers[state.quizIndex]===undefined?'disabled':''} onclick="state.quizIndex++;renderApp();">Suivant</button>` :
          `<button class="btn btn-gold" ${state.quizAnswers[state.quizIndex]===undefined?'disabled':''} onclick="submitQuiz()">Terminer le quiz</button>`}
      </div>
    </div>
  </div>`;
}
async function submitQuiz(){
  const c = COURSES.find(x=>x.id===state.courseId) || COURSES[0];
  const realModule = c.modules && c.modules.find(m=>m.id===state.moduleId);
  const activeBank = (realModule && realModule.quiz && realModule.quiz.length) ? realModule.quiz : QUIZ_BANK;
  let score = 0;
  activeBank.forEach((qq,i)=>{ if(state.quizAnswers[i]===qq.correct) score++; });
  const pct = Math.round(score/activeBank.length*100);
  if(realModule && CURRENT_PROFILE){
    await sb.from('module_progress').upsert({
      student_id: CURRENT_PROFILE.id, course_id: c.id, module_id: realModule.id,
      quiz_passed: pct>=60, quiz_score: pct,
    }, { onConflict: 'student_id,module_id' });
    await sbLoadModuleProgress(c.id);
    await loadStudentData(); // refresh enrollment progress %
  }
  state.quizSubmitted = true;
  renderApp();
}

let MODULE_DRAFT = {title:'', theory:'', videoUrl:'', quiz:[]};
function goToModuleStep(){
  state.courseBuilderInfo = {
    title: document.getElementById('newCourseTitle').value,
    cat: document.getElementById('newCourseCat').value,
    level: document.getElementById('newCourseLevel').value,
    duration: document.getElementById('newCourseDuration').value,
    price: document.getElementById('newCoursePrice').value,
    desc: document.getElementById('newCourseDesc').value,
    image: getUploadedImage('courseImg'),
  };
  if(!state.courseBuilderInfo.title) return alert('Merci de renseigner un titre de cours.');
  state.courseBuilderStep = 2;
  renderApp();
}
function openModuleEditor(){
  MODULE_DRAFT = {title:'', theory:'', videoUrl:'', quiz:[]};
  state.showModuleEditor = true;
  renderApp();
}
function cancelModuleEditor(){
  state.showModuleEditor = false;
  renderApp();
}
function syncModuleDraftFromDOM(){
  const titleEl = document.getElementById('modTitle');
  if(!titleEl) return;
  MODULE_DRAFT.title = titleEl.value;
  MODULE_DRAFT.theory = document.getElementById('modTheory').value;
  MODULE_DRAFT.videoUrl = document.getElementById('modVideo').value;
  MODULE_DRAFT.quiz.forEach((q,qi)=>{
    const qEl = document.getElementById('qz_'+qi+'_q');
    if(!qEl) return;
    q.q = qEl.value;
    q.options = [0,1,2,3].map(oi=>document.getElementById('qz_'+qi+'_opt'+oi).value);
    const checked = document.querySelector('input[name="qz_'+qi+'_correct"]:checked');
    q.correct = checked ? parseInt(checked.value) : 0;
  });
}
function addQuizQuestion(){
  syncModuleDraftFromDOM();
  MODULE_DRAFT.quiz.push({q:'', options:['','','',''], correct:0});
  renderApp();
}
function removeQuizQuestion(i){
  syncModuleDraftFromDOM();
  MODULE_DRAFT.quiz.splice(i,1);
  renderApp();
}
function saveModuleDraft(){
  syncModuleDraftFromDOM();
  if(!MODULE_DRAFT.title) return alert('Merci de renseigner un titre de module.');
  state.builderModules.push(JSON.parse(JSON.stringify(MODULE_DRAFT)));
  state.showModuleEditor = false;
  renderApp();
}
function removeBuilderModule(idx){
  state.builderModules.splice(idx,1);
  renderApp();
}
async function createTeacherCourse(){
  const info = state.courseBuilderInfo;
  if(!info || !info.title) return alert('Merci de compléter les informations du cours (étape 1).');
  if(!CURRENT_PROFILE){ go('login'); return; }
  if(state.builderModules.length===0 && !confirm('Aucun module ajouté. Publier quand même le cours ?')) return;
  const price = parseInt(info.price)||0;

  const { data: courseRow, error: courseErr } = await sb.from('courses').insert({
    title: info.title, category: info.cat, level: info.level,
    duration_text: info.duration || '4 semaines', weeks: 4, lang: 'Français',
    price_usd: price, description: info.desc || 'Description à venir.',
    cover_image_url: info.image || null, instructor_id: CURRENT_PROFILE.id,
  }).select().single();
  if(courseErr){ alert('Erreur lors de la création du cours : ' + courseErr.message); return; }

  for(let i=0; i<state.builderModules.length; i++){
    const m = state.builderModules[i];
    const { data: modRow, error: modErr } = await sb.from('modules').insert({
      course_id: courseRow.id, position: i+1, title: m.title || `Module ${i+1}`,
      theory: m.theory || null, video_url: m.videoUrl || null,
    }).select().single();
    if(modErr){ console.error(modErr); continue; }
    if(m.quiz && m.quiz.length){
      const questionRows = m.quiz.map((q, qi) => ({
        module_id: modRow.id, position: qi+1, question: q.q || `Question ${qi+1}`,
        options: q.options, correct_index: q.correct,
      }));
      await sb.from('quiz_questions').insert(questionRows);
    }
  }

  alert('Cours publié avec succès, avec ' + state.builderModules.length + ' module(s) !');
  await sbLoadCourses();
  state.teacherTab='my-courses';
  state.courseBuilderStep=1;
  state.courseBuilderInfo={};
  state.builderModules=[];
  renderApp();
}

async function adminSaveContent(){
  const fields = {
    motto: 'siteMotto', heroEyebrow: 'siteHeroEyebrow', heroTitle: 'siteHeroTitle',
    heroTitleAccent: 'siteHeroTitleAccent', heroLead: 'siteHeroLead', aboutMission: 'siteAboutMission',
    footerAbout: 'siteFooterAbout', contactPhone: 'siteContactPhone', contactAddress: 'siteContactAddress',
    contactEmail: 'siteContactEmail', contactHours: 'siteContactHours',
  };
  const dbKeyMap = {
    motto:'motto', heroEyebrow:'hero_eyebrow', heroTitle:'hero_title', heroTitleAccent:'hero_title_accent',
    heroLead:'hero_lead', footerAbout:'footer_about', aboutMission:'about_mission',
    contactPhone:'contact_phone', contactAddress:'contact_address', contactEmail:'contact_email', contactHours:'contact_hours',
  };
  const rows = [];
  for(const key in fields){
    const val = document.getElementById(fields[key]).value;
    SITE_CONTENT[key] = val;
    rows.push({ key: dbKeyMap[key], value: val });
  }
  const { error } = await sb.from('site_content').upsert(rows, { onConflict: 'key' });
  if(error){ alert('Erreur : ' + error.message); return; }
  alert('Contenu du site mis à jour !');
  renderApp();
}
function adminAddCourse(){ go('become-teacher'); }
async function adminDeleteCourse(id){
  if(!confirm('Supprimer ce cours ? Cette action supprime aussi ses modules, quiz et inscriptions.')) return;
  const { error } = await sb.from('courses').delete().eq('id', id);
  if(error){ alert('Erreur : ' + error.message); return; }
  const i = COURSES.findIndex(c=>c.id===id);
  if(i>-1) COURSES.splice(i,1);
  renderApp();
}
async function adminSaveCourseEdit(){
  const c = COURSES.find(cc=>cc.id===state.editing.id);
  if(!c) return;
  const title = document.getElementById('editCourseTitle').value || c.title;
  const price = parseInt(document.getElementById('editCoursePrice').value)||0;
  const level = document.getElementById('editCourseLevel').value;
  const duration = document.getElementById('editCourseDuration').value || c.duration;
  const desc = document.getElementById('editCourseDesc').value || c.desc;
  const { error } = await sb.from('courses').update({
    title, price_usd: price, level, duration_text: duration, description: desc,
  }).eq('id', c.id);
  if(error){ alert('Erreur : ' + error.message); return; }
  Object.assign(c, { title, price, free: price===0, level, duration, desc });
  state.editing = {type:null,id:null};
  alert('Cours mis à jour !');
  renderApp();
}
function adminCancelEdit(){
  state.editing = {type:null,id:null};

}
async function adminSaveArticle(){
  const title = document.getElementById('artTitle').value;

  const excerpt = document.getElementById('artExcerpt').value || '';
  const author = document.getElementById('artAuthor').value || 'Administrateur';
  const image = getUploadedImage('artImg');
  if(state.editing.type==='article' && state.editing.id){
    const { error } = await sb.from('articles').update({ title, tag, excerpt, author, image_url: image || undefined }).eq('id', state.editing.id);
    if(error){ alert('Erreur : ' + error.message); return; }
  } else {
    const { error } = await sb.from('articles').insert({ title, tag, excerpt, author, image_url: image });
    if(error){ alert('Erreur : ' + error.message); return; }
  }
  state.editing = {type:null,id:null};
  await sbLoadPublicContent();
  renderApp();
}

async function adminSavePage(){

  const status = statusFr === 'Publiée' ? 'publiee' : 'brouillon';

async function submitTeacherApplication(){
  const full_name = document.getElementById('taName').value.trim();
  const email = document.getElementById('taEmail').value.trim();
  const phone = document.getElementById('taPhone').value.trim();
  const domain = document.getElementById('taDomain').value;
  const experience = document.getElementById('taExperience').value.trim();
  const portfolio_url = document.getElementById('taPortfolio').value.trim();
  if(!full_name || !email){ alert('Merci de renseigner au moins votre nom et votre e-mail.'); return; }
  const btn = document.getElementById('taSubmitBtn');
  btn.disabled = true; btn.textContent = 'Envoi en cours...';
  const { error } = await sb.from('teacher_applications').insert({
    profile_id: CURRENT_PROFILE ? CURRENT_PROFILE.id : null,
    full_name, email, phone, domain, experience, portfolio_url,
  });
  btn.disabled = false; btn.textContent = 'Envoyer ma candidature';
  if(error){ alert("Erreur lors de l'envoi : " + error.message); return; }
  alert("Candidature envoyée avec succès ! Notre équipe l'examinera et vous recontactera sous 48h.");
  go('home');
}

/* ===================== ROUTER / RENDER ===================== */
function renderApp(){
  const app = document.getElementById('app');
  let html = '';
  switch(state.page){
    case 'home': html = renderHome(); break;
    case 'courses': html = renderCourses(); break;
    case 'course-detail': html = renderCourseDetail(); break;
    case 'login': html = renderLogin(); break;
    case 'register': html = renderRegister(); break;
    case 'become-teacher': html = renderBecomeTeacher(); break;
    case 'dashboard': html = renderDashboard(); break;
    case 'checkout': html = renderCheckout(); break;
    case 'certificate-request': html = renderCertificateRequest(); break;
    case 'quiz': html = renderQuiz(); break;
    case 'forgot-password': html = renderForgotPassword(); break;
    case 'contact': html = renderContact(); break;
    case 'about': html = renderAbout(); break;
    case 'instructor-profile': html = renderInstructorProfile(); break;
    case 'instructors': html = renderAllInstructorsPage(); break;
    case 'article-detail': html = renderArticleDetail(); break;
    case 'teacher-dashboard': html = renderTeacherDashboard(); break;
    case 'admin-dashboard': html = renderAdminDashboard(); break;
    case '404': html = render404(); break;
    default: html = render404();
  }
  app.innerHTML = html;
  renderNavbar();
  renderFooter();
}

function render(){ renderApp(); renderCookieBanner(); }
updateSEO(state.page);
render(); // initial paint (seed placeholders) while we fetch live data
sbRestoreSession(); // then swap in real session + live courses/content from Supabase
</script>
