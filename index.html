<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!--
    Ce fichier gère toutes les pages NON sensibles en mode "SPA", comme
    dans le prototype d'origine : accueil, à propos, contact, FAQ,
    articles, actualités, formateurs, connexion, inscription, mot de
    passe oublié. Le contenu change via JS (assets/js/app/router.js),
    sans recharger la page — exactement comme avant.

    Le <title>/<meta> ci-dessous sont mis à jour dynamiquement par
    updateSEO() (voir assets/js/app/seo.js), comme le faisait déjà
    l'ancien prototype (fonction updateSEO(page)).
  -->
  <title>JC Academy — Formations en ligne certifiantes</title>
  <meta name="description" content="Apprenez avec JC Academy : cours en ligne, certificats reconnus, formateurs experts." />
  <link rel="canonical" href="https://jcacademy.online/" />
  <meta property="og:title" content="JC Academy — Formations en ligne certifiantes" />
  <meta property="og:description" content="Apprenez avec JC Academy : cours en ligne, certificats reconnus, formateurs experts." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <div id="app-root">
    <!-- Rempli dynamiquement par le routeur SPA selon la page courante -->
  </div>

  <div id="footer-root"></div>

  <script type="module" src="/main.js"></script>
</body>
</html>
