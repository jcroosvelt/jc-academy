<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!--
    Page de LISTE des cours uniquement. Le détail de chaque cours a sa
    propre vraie page à /cours/<slug>, générée par l'Edge Function
    "course-page" (voir supabase/functions/course-page/ et
    public/_redirects), pour que chaque cours soit indexable et
    partageable individuellement sans avoir besoin d'un fichier .html
    fixe par cours.
  -->
  <title>Nos cours — JC Academy</title>
  <meta name="description" content="Découvrez tous les cours JC Academy." />
  <link rel="canonical" href="https://jcacademy.online/cours.html" />
  <meta property="og:title" content="Nos cours — JC Academy" />
  <meta property="og:description" content="Découvrez tous les cours JC Academy." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="navbar-root"></div>

  <main id="page-root">
    <p>Chargement des cours…</p>
  </main>

  <div id="footer-root"></div>

  <script type="module">
    import { renderNavbar } from "/navbar.js";
    import { renderFooter } from "/footer.js";
    renderNavbar();
    renderFooter();
  </script>
  <script type="module" src="/cours.js"></script>
</body>
</html>
